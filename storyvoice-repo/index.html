<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryVoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#E9E6DF;--surface:#F4F2EC;--raise:#FFFFFF;--line:#D3CDC2;--ink:#1B1916;--muted:#6A6358;
  --accent:#9E5B00;--accent-ink:#FFF8EC;--hl:rgba(158,91,0,.13);--cl:36%;--cs:55%;--danger:#B23B2E;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211;--surface:#1B1918;--raise:#25221F;--line:#35312C;--ink:#EDE7DC;--muted:#9E968A;
    --accent:#F2A53A;--accent-ink:#1C1204;--hl:rgba(242,165,58,.16);--cl:73%;--cs:62%;--danger:#F07A6A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131211;--surface:#1B1918;--raise:#25221F;--line:#35312C;--ink:#EDE7DC;--muted:#9E968A;
  --accent:#F2A53A;--accent-ink:#1C1204;--hl:rgba(242,165,58,.16);--cl:73%;--cs:62%;--danger:#F07A6A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.serif{font-family:Literata,Georgia,"Times New Roman",serif}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.wordmark{font-family:Literata,Georgia,serif;font-style:italic;font-weight:500;font-size:23px;text-decoration:none;letter-spacing:-.015em}
.ai-pill{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 140px}
body.on-player main{padding-bottom:60px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;text-decoration:none;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h2.sec{font-size:15px;color:var(--muted);font-weight:500;margin:44px 0 16px}
.fine{color:var(--muted);font-size:13px;margin:10px 0 0}
.note{color:var(--muted);font-size:14px}

/* Library */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,5vw,64px);align-items:end}
.hero h1{font-family:Literata,Georgia,serif;font-weight:500;font-size:clamp(36px,5.6vw,64px);line-height:1.02;letter-spacing:-.025em}
.hero p{color:var(--muted);max-width:44ch;margin:16px 0 0;font-size:16px}
.drop{display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:176px;padding:26px;border:1.5px dashed var(--line);border-radius:20px;cursor:pointer;background:var(--surface);transition:border-color .2s,background-color .2s}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop.over{background:var(--hl)}
.drop-title{font-size:19px;font-weight:600}
.drop-sub{color:var(--muted)}
.drop-sub u{color:var(--accent);text-underline-offset:3px}
.getbooks{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:var(--surface);transition:border-color .2s}
.getbooks:hover{border-color:var(--accent)}
.gb-k{font-weight:600;grid-column:1}
.gb-t{grid-column:1;color:var(--muted);font-size:14px}
.gb-a{grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-size:20px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:30px 22px}
.book{text-decoration:none;display:flex;flex-direction:column;gap:10px;min-width:0}
.book .bt{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.book .ba{color:var(--muted);font-size:13px;margin-top:-6px}
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;position:relative;background:var(--raise);container-type:inline-size;box-shadow:0 0 0 1px var(--line),0 14px 26px -16px rgba(0,0,0,.6)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent);pointer-events:none}
.gen{position:absolute;inset:0;background:hsl(var(--h) 24% 19%);color:#F4EEE3;display:flex;flex-direction:column;padding:11% 11% 10% 14%}
.gen::before{content:"";position:absolute;left:0;right:0;top:0;height:33%;background:hsl(var(--h) 40% 42%)}
.gen .t{position:relative;margin-top:40%;font-family:Literata,Georgia,serif;font-weight:500;font-size:16px;font-size:11.5cqi;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.gen .a{position:relative;margin-top:auto;font-size:11px;font-size:7cqi;opacity:.78}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.status{font-size:12.5px;color:var(--muted);line-height:1.35}
.status.busy{color:var(--accent)}

.now{display:grid;grid-template-columns:84px 1fr auto;gap:20px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);margin-bottom:12px}
.now h3{font-family:Literata,Georgia,serif;font-weight:500;font-size:21px;line-height:1.2}
.now .bar{margin-top:10px;max-width:420px}
@media (max-width:560px){.now{grid-template-columns:64px 1fr}.now .btn{grid-column:1/-1}}

/* Book page */
.crumb{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:20px}
.crumb:hover{color:var(--ink)}
.bookhead{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(20px,4vw,48px);align-items:start}
.bookhead h1{font-family:Literata,Georgia,serif;font-size:clamp(28px,4.2vw,46px);font-weight:500;line-height:1.08;letter-spacing:-.02em;overflow-wrap:anywhere}
.byline{font-size:17px;margin-top:8px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);margin-top:14px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.job,.notice{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);max-width:600px}
.job .row{justify-content:space-between}
.job .bar{margin:10px 0 0}
.notice p{margin:0 0 10px}
.notice p:last-child{margin:0}
.cast-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.chip b{width:22px;height:22px;border-radius:50%;background:hsl(var(--h) var(--cs) var(--cl));display:grid;place-items:center;font-size:11px;color:var(--bg);font-weight:600}
.chip small{color:var(--muted)}
.chapters{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.chapters li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.chapters li>button{flex:1;min-width:0;display:grid;grid-template-columns:2.6em 1fr auto auto;gap:14px;align-items:baseline;padding:12px 4px;border:0;background:none;text-align:left;cursor:pointer}
.chacts{display:flex;gap:6px;align-items:center;flex:none;padding-right:4px}
.chacts .btn{padding:5px 11px;font-size:12.5px}
.aqs{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters button:hover{background:var(--surface)}
.chapters .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chapters .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;color:var(--muted);min-width:4.5em;text-align:right}
.tag.ok{color:var(--accent)}
@media (max-width:640px){.bookhead{grid-template-columns:118px 1fr}.chapters li>button{grid-template-columns:2em 1fr auto}.chapters li{flex-wrap:wrap}.chacts{padding:0 0 10px 2.6em}.chapters .d{display:none}}

/* Studio */
.studio-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.studio-head h1{font-family:Literata,Georgia,serif;font-weight:500;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em}
.studio{display:grid;grid-template-columns:310px 1fr;gap:28px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h3{font-size:16px;margin-bottom:14px}
.panel+.panel{margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13.5px}
.field>span{color:var(--muted);display:flex;justify-content:space-between}
select,input[type=text],textarea{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.char{border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;background:var(--surface);border-top:4px solid hsl(var(--h) var(--cs) var(--cl));min-width:0}
.char.narr{border-top-color:var(--ink)}
.char header{display:flex;justify-content:space-between;align-items:start;gap:10px}
.char h3{font-family:Literata,Georgia,serif;font-size:21px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.char .g{font-size:13px;color:var(--muted);margin-top:2px}
.char dl{margin:12px 0 14px;display:grid;grid-template-columns:7.5em 1fr;gap:5px 10px;font-size:13.5px}
.char dt{color:var(--muted)}
.char dd{margin:0;overflow-wrap:anywhere}
.voicebox{border-top:1px solid var(--line);padding-top:12px}
.warn{color:var(--danger);font-size:12.5px;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:880px){.studio{grid-template-columns:1fr}}

/* Player */
.player{display:grid;grid-template-columns:330px minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.deck{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.deck-top .cover{width:min(200px,62%)}
.deck-top .back{display:block;color:var(--muted);text-decoration:none;font-size:14px;margin-top:18px}
.deck-top .back:hover{color:var(--ink)}
.deck-top h2{font-family:Literata,Georgia,serif;font-weight:500;font-size:24px;line-height:1.2;margin-top:4px}
.speaker{display:flex;align-items:center;gap:12px;margin:18px 0 6px;min-height:46px}
.speaker .av{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:Literata,Georgia,serif;font-size:20px;background:hsl(var(--h) var(--cs) var(--cl));color:var(--bg);transition:background-color .35s}
.speaker.narr .av{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.speaker b{display:block;font-weight:600;line-height:1.2}
.speaker small{color:var(--muted);font-size:13px}
.seek{height:6px;background:var(--line);border-radius:6px;cursor:pointer;position:relative;margin-top:16px;touch-action:none}
.seek i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;width:0}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.controls{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px;gap:6px}
.ic{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;cursor:pointer;padding:0}
.ic:hover{border-color:var(--muted)}
.ic svg{width:22px;height:22px}
.ic.big{width:64px;height:64px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ic.big svg{width:28px;height:28px}
.extras{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.extras label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.extras select{padding:6px 8px;font-size:13.5px}
.drawer{border-top:1px solid var(--line);margin-top:16px;padding-top:6px}
.drawer summary{cursor:pointer;padding:8px 0;font-weight:500}
.chlist,.marks{list-style:none;padding:0;margin:0 0 8px;max-height:260px;overflow:auto}
.chlist button,.marks button.go{width:100%;text-align:left;background:none;border:0;padding:7px 4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-radius:8px;font-size:14px}
.chlist button:hover,.marks button.go:hover{background:var(--surface)}
.chlist button.cur{color:var(--accent);font-weight:600}
.chlist span{color:var(--muted);font-size:12.5px;flex:none;font-weight:400}
.marks li{display:flex;align-items:center;gap:4px}
.marks button.go{flex:1;flex-direction:column;gap:0}
.marks small{color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px}
.x:hover{color:var(--danger)}

.text{font-family:Literata,Georgia,serif;font-size:19px;line-height:1.78;max-width:66ch;position:relative;min-width:0}
.text h2{font-family:Literata,Georgia,serif;font-weight:500;font-size:clamp(26px,3.4vw,34px);line-height:1.15;margin:4px 0 28px;letter-spacing:-.015em}
.text p{margin:0 0 1.05em;color:var(--muted);transition:color .3s}
.text p.cur{color:var(--ink)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:14px;margin-bottom:24px;align-items:center}
.tbar .hint{color:var(--muted);font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{cursor:pointer;border-radius:3px;transition:background-color .2s}
.seg.d{color:hsl(var(--h) var(--cs) var(--cl));text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:hsl(var(--h) var(--cs) var(--cl) / .45)}
.seg.d.unk{color:inherit;text-decoration-style:dashed;text-decoration-color:var(--muted)}
.seg.d.me{color:inherit;text-decoration-color:var(--muted)}
p:not(.cur) .seg.d{opacity:.72}
.seg.on.n{color:var(--ink)}
.pc{border-radius:4px;transition:background-color .3s}
.pc.live{background:var(--hl);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 0}
.pc.live .wd{opacity:.5;transition:opacity .22s ease-out}
.pc.live .wd.wd-s{opacity:1}
.pc.live .wd.wd-n{opacity:1;background-image:linear-gradient(var(--accent),var(--accent));background-repeat:no-repeat;background-position:0 100%;background-size:100% 2.5px;animation:wordin .22s ease-out}
p:not(.cur) .seg.d.on{opacity:1}
@keyframes wordin{from{background-size:0 2.5px}to{background-size:100% 2.5px}}
@media (prefers-reduced-motion: reduce){.pc.live .wd.wd-n{animation:none}}
.fixing .seg.d{outline:1px dashed var(--line);outline-offset:2px}
.preparing{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:14px;color:var(--accent);margin-bottom:18px}
.pop{position:absolute;left:0;z-index:5;width:min(340px,100%);background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 22px 44px -18px rgba(0,0,0,.55);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.4}
.pop-q{margin:0 0 8px;font-weight:600}
.pop-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;max-height:180px;overflow:auto}
.pop-list button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 5px;cursor:pointer;font-size:13px}
.pop-list button b{width:14px;height:14px;border-radius:50%;background:hsl(var(--h) var(--cs) var(--cl))}
.pop-list button.plain{padding-left:10px}
.pop-list button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pop .field{margin:0}

@media (max-width:860px){
  .player{grid-template-columns:1fr;gap:20px}
  .deck{position:static}
  .deck-top{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
  .deck-top .cover{width:76px}
  .deck-top .back{margin-top:0}
  .deck-top h2{font-size:20px}
  .deck-top .speaker{grid-column:1/-1;margin:4px 0 0}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:4px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .dock .seek{margin-top:10px}
  .dock .controls{margin:8px 0 6px}
  body.on-player main{padding-bottom:250px}
  .text{font-size:18px}
}

.foot{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px) calc(110px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px}
.foot a{color:var(--accent);text-underline-offset:3px}
body.on-player .foot{display:none}
body:not(.on-player) main{padding-bottom:40px}
body.on-player main{padding-bottom:40px}
/* Mini player and toasts */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.mini-in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:16px;background:var(--raise);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.mini-link{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none}
.mini .cover{width:36px;flex:none;box-shadow:none}
.mini .gen .t,.mini .gen .a{display:none}
.mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mini small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}

<body>
<header class="top">
  <a class="wordmark" href="#library">StoryVoice</a>
  <span class="ai-pill" id="ai-pill"><span class="dot"></span>Connecting to Claude</span>
</header>
<main id="main"></main>
<footer class="foot">StoryVoice is free, open-source software under the <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank" rel="noopener">AGPL-3.0</a>. <a id="src-link" href="https://github.com/YOUR-USERNAME/storyvoice" target="_blank" rel="noopener">Source code and contributing</a></footer>
<div class="mini" id="mini" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=()=>(Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tick=()=>new Promise(r=>setTimeout(r,0));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const words=t=>(String(t).match(/\S+/g)||[]).length;
const WPS=2.6; // spoken words per second at 1x
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}
function fmtLong(sec){const m=Math.max(1,Math.round(sec/60));return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),5200);}
function throttle(fn,ms){let t=null,pend=false;return()=>{if(t){pend=true;return;}fn();t=setTimeout(()=>{t=null;if(pend){pend=false;fn();}},ms);};}

/* ---------- Storage ---------- */
const Store={db:null,mem:new Map(),
  async open(){if(this.db!==null)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('storyvoice',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('books'))db.createObjectStore('books',{keyPath:'id'});if(!db.objectStoreNames.contains('audio'))db.createObjectStore('audio');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){this.db=false;}return this.db;},
  async tx(mode,fn){const db=await this.open();if(!db)return null;return new Promise((res,rej)=>{const t=db.transaction('books',mode);const r=fn(t.objectStore('books'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  async atx(mode,fn){const db=await this.open();if(!db)return null;return new Promise((res,rej)=>{const t=db.transaction('audio',mode);const r=fn(t.objectStore('audio'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  async aget(k){try{return await this.atx('readonly',s=>s.get(k));}catch(e){return null;}},
  async ahas(k){try{return (await this.atx('readonly',s=>s.getKey(k)))!==undefined;}catch(e){return false;}},
  async aput(k,v){try{await this.atx('readwrite',s=>s.put(v,k));return true;}catch(e){console.warn('Audio save failed',e);return false;}},
  async adelBook(id){try{await this.atx('readwrite',s=>s.delete(IDBKeyRange.bound(id+'|',id+'|\uffff')));}catch(e){}},
  async all(){try{const r=await this.tx('readonly',s=>s.getAll());if(r)return r;}catch(e){}return[...this.mem.values()];},
  async put(b){this.mem.set(b.id,b);try{await this.tx('readwrite',s=>s.put(b));}catch(e){console.warn('Save failed',e);}},
  async del(id){this.mem.delete(id);try{await this.tx('readwrite',s=>s.delete(id));}catch(e){}}
};
const Prog={get(id){try{return JSON.parse(localStorage.getItem('sv-p-'+id))||null;}catch(e){return null;}},set(id,v){try{localStorage.setItem('sv-p-'+id,JSON.stringify(v));}catch(e){}},del(id){try{localStorage.removeItem('sv-p-'+id);}catch(e){}}};
const Books=new Map();
async function save(b){b.updatedAt=Date.now();await Store.put(b);}

/* ---------- Claude (sample capability) ---------- */
const AI={s:null,on:false,settled:false,imgs:false,ready:null};
AI.ready=(async()=>{
  await tick();
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const s=await window.claude.use('sample');
      if(s){AI.s=s;AI.on=true;try{const lim=await s.limits();AI.imgs=!!(lim&&lim.images);}catch(e){}}
    }
  }catch(e){}
  AI.settled=true;renderAI();refresh();
})();
async function ask(prompt,{signal,images,tier='default'}={}){
  await AI.ready;
  if(!AI.on)throw{code:'unavailable',message:'Claude is not available here'};
  try{
    const opts={modelTier:tier};if(signal)opts.signal=signal;if(images)opts.images=images;
    return await AI.s.json(prompt,opts);
  }catch(e){
    if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){AI.on=false;renderAI();}
    throw e;
  }
}
async function askText(prompt,{signal,images}={}){
  await AI.ready;if(!AI.on)throw{code:'unavailable'};
  const opts={modelTier:'default'};if(signal)opts.signal=signal;if(images)opts.images=images;
  const r=await AI.s(prompt,opts);return r.text;
}
function errCopy(e){const c=e&&e.code;return({rate_limited:'Claude’s usage limit was reached. Wait a while, then continue.',not_granted:'Claude access was declined for this page, so AI analysis is off.',sampling_disabled:'Claude isn’t available for this account.',session_expired:'Your claude.ai session expired. Sign in again, then continue.',unavailable:'Claude isn’t available here, so speakers were guessed from tags like ‘said Sarah’.',refused:'Claude declined to analyze part of this book.',invalid_json:'Claude’s answer couldn’t be read. Try again.',prompt_too_large:'A passage was too long to send to Claude.',upstream_error:'The connection to Claude dropped. Try again.',images_unavailable:'Claude can’t read page images in this view.'})[c]||(e&&e.message)||'Something went wrong.';}
function renderAI(){const el=$('#ai-pill');if(!el)return;
  if(!IN_CLAUDE){const e=engine()==='kokoro';el.innerHTML=`<span class="dot${e&&KK.state==='ready'?' on':''}"></span>${!e?'Browser voices':KK.state==='ready'?'Kokoro voices ready':KK.state==='loading'?`Loading Kokoro ${Math.round(KK.progress*100)}%`:KK.state==='error'?'Kokoro didn’t load':'Kokoro voices'}`;el.title='Local version: speakers are guessed from the text unless you import a book analyzed on claude.ai.';return;}
  if(!AI.settled){el.innerHTML='<span class="dot"></span>Connecting to Claude';el.title='';return;}
  el.innerHTML=AI.on?'<span class="dot on"></span>Claude analysis on':'<span class="dot"></span>Claude analysis off';
  el.title=AI.on?'Claude reads each book to cast characters and attribute dialogue.':'Open StoryVoice on claude.ai and allow Claude to analyze books. Without it, speakers are guessed from the text.';}

/* ---------- Voices ---------- */
let VOICES=[];
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Pipe Organ)\b/i;
const LOWQ=/\b(Fred|Junior|Ralph|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
const FEM=new Set('samantha victoria karen moira tessa fiona veena zira susan hazel serena kate allison ava joanna salli kimberly kendra ivy emma amy nicole olivia aria jenny michelle sonia libby natasha clara heera neerja isha raveena catherine lekha sara anna alice ellen laura linda martha nora paulina yuna kyoko amelie monica joana luciana milena zuzana ioana satu melina carmen alva mariska ana maisie molly emily leah ezinne rosa yan asilia imani nancy jane elizabeth sarah grace isabella sofia mia ella zoe lily charlotte heather vicki flo sandy shelley grandma princess kathy agnes tracy luna female woman'.split(' '));
const MALE=new Set('daniel alex fred tom david mark george james ravi rishi aaron arthur gordon lee oliver thomas ryan guy eric christopher roger steffan brian matthew justin joey prabhat hemant rocko grandpa eddy reed ralph albert junior bruce jorge diego juan luca xander yuri maged tarik aman william liam andrew mitchell connor luke abeo wayne sam elimu daudi richard john paul peter michael adam noah jacob ethan chilemba male man'.split(' '));
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>!NOVELTY.test(v.name));}catch(e){VOICES=[];}}
function voiceGender(v){const n=v.name.toLowerCase().replace(/multilingual/g,' ');if(/female|woman/.test(n))return'female';if(/\bmale\b/.test(n))return'male';const t=n.split(/[^a-z]+/);if(t.some(x=>FEM.has(x)))return'female';if(t.some(x=>MALE.has(x)))return'male';return'unknown';}
function voiceQuality(v){let q=0;if(/natural|neural|premium|enhanced|wavenet|online/i.test(v.name))q+=3;if(/google/i.test(v.name))q+=1;if(LOWQ.test(v.name))q-=3;return q;}
function isNatural(v){return /natural|neural|premium|enhanced|wavenet/i.test(v.name)||(/online/i.test(v.name)&&/microsoft/i.test(v.name));}
function voiceTip(b,studio){
  if(engine()==='kokoro')return'';
  if(!VOICES.length)return'';
  const nat=VOICES.filter(isNatural);
  if(!nat.length)return`<div class="notice" style="margin:0 0 20px"><p><b>Want natural AI voices for free?</b> Open this page in Microsoft Edge. Edge includes Microsoft’s neural voices, such as Aria, Guy, Sonia, Ryan, Neerja and Prabhat, which sound far more human than this browser’s voices.</p></div>`;
  if(studio){const used=[b.narrator,...b.characters.map(c=>c.voice)].filter(Boolean);if(used.some(v=>{const x=voiceByName(v.name);return x&&!isNatural(x);}))return`<div class="notice" style="margin:0 0 20px"><p>${nat.length} natural AI voices are available in this browser, but some roles still use older voices.</p><p><button class="btn sm primary" data-act="reassign" data-id="${b.id}">Switch everyone to natural voices</button></p></div>`;}
  return'';
}
function voiceByName(n){return n?VOICES.find(v=>v.name===n)||null:null;}
function shortVoice(v){return v.name.replace(/^Microsoft\s+/,'').replace(/\s+Online \(Natural\)/,' (Natural)').replace(/\s+-\s+.*$/,'');}
function voicePool(b){
  const acc=b.settings.accent||'all';let P=acc==='all'?VOICES.filter(v=>v.lang.toLowerCase().startsWith((b.lang||'en').toLowerCase())):VOICES.filter(v=>v.lang===acc);
  if(!P.length)P=VOICES.slice();const nat=P.filter(isNatural);if(nat.length>=3)P=nat;return P.sort((a,c)=>voiceQuality(c)-voiceQuality(a));
}

/* ---------- Kokoro AI voices (local version only) ---------- */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const KOKORO_URL='https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.web.js';
const KOKORO_MODEL='onnx-community/Kokoro-82M-v1.0-ONNX';
const KVOICES=[['af_heart','Heart','female','American',10],['af_bella','Bella','female','American',9],['af_nicole','Nicole','female','American',7],['af_aoede','Aoede','female','American',6],['af_kore','Kore','female','American',6],['af_sarah','Sarah','female','American',6],['af_alloy','Alloy','female','American',5],['af_nova','Nova','female','American',5],['af_sky','Sky','female','American',4],['af_jessica','Jessica','female','American',3],['af_river','River','female','American',3],['am_fenrir','Fenrir','male','American',6],['am_michael','Michael','male','American',6],['am_puck','Puck','male','American',6],['am_echo','Echo','male','American',3],['am_eric','Eric','male','American',3],['am_liam','Liam','male','American',3],['am_onyx','Onyx','male','American',3],['am_adam','Adam','male','American',1],['bf_emma','Emma','female','British',7],['bf_isabella','Isabella','female','British',5],['bf_alice','Alice','female','British',3],['bf_lily','Lily','female','British',3],['bm_george','George','male','British',5],['bm_fable','Fable','male','British',5],['bm_lewis','Lewis','male','British',4],['bm_daniel','Daniel','male','British',3]].map(([id,label,gender,accent,q])=>({id,label,gender,accent,q}));
const KK={mod:null,tts:null,state:'off',loading:null,progress:0,msg:'',device:'',cache:new Map(),waiters:new Map(),queue:[],running:false,ctx:null,src:null};
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
function engine(){if(IN_CLAUDE)return'device';const d=IS_MOBILE?'device':'kokoro';try{return localStorage.getItem('sv-engine')||d;}catch(e){return d;}}
function setEngine(v){try{localStorage.setItem('sv-engine',v);}catch(e){}if(v==='kokoro')kkLoad();}
function kkCtx(){try{if(!KK.ctx)KK.ctx=new (window.AudioContext||window.webkitAudioContext)();if(KK.ctx.state==='suspended')KK.ctx.resume();}catch(e){}return KK.ctx;}
function kkStop(){if(KK.src){const s=KK.src;KK.src=null;try{s.onended=null;s.stop();}catch(e){}}}
function refreshKK(){renderAI();const el=$('[data-kk]');if(el)el.innerHTML=kkStatusHTML();if(View.name==='play')P.ui();}
function kkDiag(){return`Sound: ${KK.ctx?KK.ctx.state:'not started yet'}. Model: ${KK.state==='ready'?'loaded on '+KK.device:KK.state}. Processor mode: ${self.crossOriginIsolated?'multi-core':'single-core'}.${KK.rtf?` Speed: ${KK.rtf.toFixed(1)}× real time${KK.rtf<1.2?' (slower than playback, so prepare chapters first)':''}.`:''}${KK.lastError?' Last error: '+KK.lastError:''}`;}
async function kkTest(){
  const ctx=kkCtx();if(!ctx){toast('This browser can’t play generated audio.');return;}
  try{await ctx.resume();}catch(e){}
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=660;g.gain.value=.15;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25);
  const d=$('#kk-diag');if(d)d.textContent=kkDiag();
  toast(ctx.state==='running'?'You should hear a short beep. If you don’t, check your volume and output device.':'The browser is blocking sound. Click Test sound again.');
  await sleep(500);
  const b=View.id&&Books.get(View.id);
  if(b)await kkPreview('This is your narrator. If you can hear me, Kokoro is working.',b.narrator.kvoice||'af_heart',b);
  const d2=$('#kk-diag');if(d2)d2.textContent=kkDiag();
}
function kkStatusHTML(){
  const diag=`<label class="field" style="margin-top:12px"><span>Run Kokoro on</span><select data-kkdev><option value="auto"${kkDevPref()!=='cpu'?' selected':''}>Graphics card if available</option><option value="cpu"${kkDevPref()==='cpu'?' selected':''}>Processor only (slower, most reliable)</option></select></label><div class="row" style="flex-wrap:wrap"><button class="btn sm" data-act="kk-test">Test sound</button></div><p class="fine" id="kk-diag">${esc(kkDiag())}</p>`;
  if(KK.state==='ready')return`<p class="note">Kokoro voices are ready, running on your ${esc(KK.device)}. Each line is generated a few seconds ahead while you listen.</p>${KK.note?`<p class="fine">${esc(KK.note)}</p>`:''}${diag}`;
  if(KK.state==='loading')return`<p class="note">${esc(KK.msg||'Loading Kokoro voices')}</p><div class="bar"><i style="width:${Math.round(KK.progress*100)}%"></i></div>`;
  if(KK.state==='error')return`<p class="warn" style="margin:0 0 10px">${esc(KK.msg)}</p><button class="btn sm" data-act="kk-load">Try again</button>${diag}`;
  return`<p class="note" style="margin:0 0 10px">Free, natural-sounding voices that run on this computer. The first load downloads 90 to 330 MB, depending on your computer. After that it’s cached.</p><button class="btn sm primary" data-act="kk-load">Load Kokoro voices</button>`;
}
const KK_WORKER_SRC=`
let tts=null,mod=null;
const MODEL=${JSON.stringify(KOKORO_MODEL)};
async function test(){try{const a=await tts.generate('Testing, one, two, three.',{voice:'af_heart'});const d=a.audio;if(!d||d.length<2400)return{ok:false,err:'The test line came back empty'};let mx=0;for(let i=0;i<d.length;i++){const x=d[i];if(x!==x)return{ok:false,err:'The test line contained invalid audio'};const ab=x<0?-x:x;if(ab>mx)mx=ab;}return mx<0.01?{ok:false,err:'The test line was silent'}:{ok:true};}catch(err){return{ok:false,err:String(err&&err.message||err)};}}
self.onmessage=async e=>{const m=e.data;
  if(m.type==='load'){
    try{
      mod=mod||await import(${JSON.stringify(KOKORO_URL)});
      const files={};
      const cb=p=>{if(p&&p.status==='progress'&&p.file){files[p.file]={l:p.loaded||0,t:p.total||0};let L=0,T=0;for(const k in files){L+=files[k].l;T+=files[k].t;}self.postMessage({type:'progress',L,T});}};
      let device='';
      if(m.pref!=='cpu'&&self.navigator&&self.navigator.gpu){try{const ad=await navigator.gpu.requestAdapter();if(ad){tts=await mod.KokoroTTS.from_pretrained(MODEL,{dtype:'fp32',device:'webgpu',progress_callback:cb});device='graphics card';self.postMessage({type:'stage',msg:'Checking the voice output'});const r=await test();if(!r.ok){tts=null;self.postMessage({type:'note',note:'Your graphics card produced silent audio, so Kokoro switched to the processor.'});}}}catch(err){tts=null;}}
      if(!tts){self.postMessage({type:'stage',msg:'Loading the processor version of the voice model'});tts=await mod.KokoroTTS.from_pretrained(MODEL,{dtype:'q8',device:'wasm',progress_callback:cb});device='processor';const r=await test();if(!r.ok)throw new Error('Kokoro loaded but produced silent audio: '+r.err);}
      self.postMessage({type:'ready',device});
    }catch(err){self.postMessage({type:'loaderror',err:String(err&&err.message||err)});}
  }else if(m.type==='gen'){
    try{const a=await tts.generate(m.text,{voice:m.voice,speed:m.speed});const d=a.audio;self.postMessage({type:'audio',id:m.id,data:d,sr:a.sampling_rate},[d.buffer]);}
    catch(err){self.postMessage({type:'genfail',id:m.id,err:String(err&&err.message||err)});}
  }
};`;
function kkMakeWorker(){try{const url=URL.createObjectURL(new Blob([KK_WORKER_SRC],{type:'text/javascript'}));return new Worker(url);}catch(e){console.warn('Background worker unavailable',e);return null;}}
function kkKillWorker(){if(KK.worker){try{KK.worker.terminate();}catch(e){}KK.worker=null;}if(KK.pending){for(const p of KK.pending.values())p.rej(new Error('Kokoro restarted'));KK.pending.clear();}}
const KK_LOAD_ERR='Kokoro voices couldn’t load. Check your internet connection and try again. If it keeps failing, run StoryVoice from a local server (see the download notes).';
function kkLoad(){
  if(IN_CLAUDE)return Promise.resolve();
  if(KK.state==='ready')return Promise.resolve();
  if(KK.state==='loading')return KK.loading;
  KK.state='loading';KK.progress=0;KK.note='';KK.msg='Downloading the Kokoro voice model';refreshKK();
  try{localStorage.setItem('sv-kk-loading',String(Date.now()));}catch(e){}
  KK.loading=new Promise(resolve=>{
    const done=()=>{try{localStorage.removeItem('sv-kk-loading');}catch(e){}refreshKK();kkPump();resolve();};
    const w=kkMakeWorker();
    if(!w){kkLoadMain().then(done);return;}
    KK.worker=w;KK.pending=new Map();KK.seq=KK.seq||0;let settled=false;
    const fallback=why=>{if(settled)return;settled=true;console.warn('Kokoro worker failed, running on the page instead:',why);kkKillWorker();kkLoadMain().then(done);};
    w.onerror=e=>{if(e&&e.preventDefault)e.preventDefault();if(KK.state==='loading')fallback(e&&e.message);else{kkKillWorker();KK.state='error';KK.lastError='The voice engine stopped: '+(e&&e.message||'unknown error');KK.msg=KK_LOAD_ERR;refreshKK();}};
    w.onmessage=e=>{const m=e.data;
      if(m.type==='progress'){KK.progress=m.T?m.L/m.T:0;KK.msg=`Downloading the voice model: ${Math.round(m.L/1048576)} of ${Math.max(1,Math.round(m.T/1048576))} MB`;refreshKK();}
      else if(m.type==='stage'){KK.msg=m.msg;refreshKK();}
      else if(m.type==='note'){KK.note=m.note;}
      else if(m.type==='ready'){settled=true;KK.device=m.device;KK.state='ready';KK.msg='';done();}
      else if(m.type==='loaderror'){settled=true;kkKillWorker();KK.lastError=String(m.err).slice(0,200);KK.state='error';KK.msg=KK_LOAD_ERR;done();}
      else if(m.type==='audio'||m.type==='genfail'){const p=KK.pending&&KK.pending.get(m.id);if(p){KK.pending.delete(m.id);if(m.type==='audio')p.res({data:m.data,sr:m.sr});else p.rej(new Error(m.err));}}
    };
    w.postMessage({type:'load',pref:IS_MOBILE?'cpu':kkDevPref()});
  });
  return KK.loading;
}
function kkGen(j){const run=()=>kkGenNow(j);const p=(KK.chain||Promise.resolve()).then(run,run);KK.chain=p.catch(()=>{});return p;}
function kkGenNow(j){
  if(KK.worker)return new Promise((res,rej)=>{const id=++KK.seq;KK.pending.set(id,{res,rej});KK.worker.postMessage({type:'gen',id,text:j.text,voice:j.voice,speed:j.speed});});
  return KK.tts.generate(j.text,{voice:j.voice,speed:j.speed}).then(a=>({data:a.audio,sr:a.sampling_rate}));
}
async function kkLoadMain(){
  {
    try{

function applyLines(b,segs,grp,byP,res){

async function analyzeInto(b,ci,st,signal){

function pronList(b){const L=[];for(const c of b.characters)if(c.pron&&c.pron.trim())L.push([c.name,c.pron.trim()]);for(const line of (b.settings.pron||'').split('\n')){const i=line.indexOf('=');if(i>0){const a=line.slice(0,i).trim(),z=line.slice(i+1).trim();if(a&&z)L.push([a,z]);}}return L;}

function splitSpeech(t){
  const out=[];const sents=t.match(/[^.!?…;:]+[.!?…;:]+['")\]]*\s*|[^.!?…;:]+$/g)||[t];let cur='';

function wavHeader(bytes,sr){const h=new DataView(new ArrayBuffer(44));const w=(o,str)=>{for(let i=0;i<str.length;i++)h.setUint8(o+i,str.charCodeAt(i));};

const PC=new WeakMap();

function splitRaw(t){
  const sents=t.match(/[^.!?…;:]*[.!?…;:]+[”’"'»)\]]*\s*|[^.!?…;:]+$/g)||[t];

/* ---------- Render + routing ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^(book|cast|play)-([a-z0-9]+)$/);
  if(m&&Books.has(m[2])){View.name=m[1];View.id=m[2];}else{View.name='library';View.id=null;}
  deleteArm=null;closeFix();render();window.scrollTo(0,0);
  if(View.id&&Books.has(View.id)){const bb=Books.get(View.id);if(!bb.narrator.kvoice&&bb.chapters.length)assignKokoro(bb);}
  if(View.name==='play'){const b=Books.get(View.id);if(b.chapters.length)P.attach(b);else location.hash='book-'+b.id;}
}
function render(){
  const main=$('#main');const b=View.id&&Books.get(View.id);
  if(View.name!=='library'&&!b){View.name='library';View.id=null;}
  main.innerHTML=View.name==='book'?viewBook(b):View.name==='cast'?viewCast(b):View.name==='play'?viewPlayer(b):viewLibrary();
  document.body.classList.toggle('on-player',View.name==='play');
  renderMini();renderAI();
  if(View.name==='play'){P.renderText();P.ui();renderMarks();}
}
const refresh=throttle(()=>{
  if(View.name==='play'){P.ui();return;}
  const ae=document.activeElement;
  if(View.name==='cast'&&(Editing.size||(ae&&$('#main').contains(ae)&&ae.matches('input,textarea,select'))))return;
  render();
},300);

/* ---------- Fix-speaker popover ---------- */
function closeFix(){$$('.pop').forEach(p=>p.remove());}
function openFix(span){
  closeFix();const i=+span.dataset.s,s=P.segs[i],b=P.book,lines=charLines(b);
  const pop=document.createElement('div');pop.className='pop';
  pop.innerHTML=`<p class="pop-q">Who says this line?</p><div class="pop-list">${[...b.characters].sort((x,y)=>(lines[y.id]||0)-(lines[x.id]||0)).map(c=>`<button data-act="fix-set" data-s="${i}" data-who="${c.id}" style="--h:${c.hue}" class="${s.s===c.id?'sel':''}"><b></b>${esc(c.name)}</button>`).join('')}<button class="plain ${s.s==='narrator'?'sel':''}" data-act="fix-set" data-s="${i}" data-who="narrator">Narrator</button><button class="plain ${!s.s?'sel':''}" data-act="fix-set" data-s="${i}" data-who="">Unknown</button></div><label class="field"><span>Emotion</span><select data-fixemo="${i}">${EMOS.map(e=>`<option${e===s.e?' selected':''}>${e}</option>`).join('')}</select></label>`;
  $('#pl-text').appendChild(pop);pop.style.top=(span.offsetTop+span.offsetHeight+8)+'px';

/* ---------- Events ---------- */
const ACT={
  listen(el){const b=Books.get(el.dataset.id);if(!b)return;unlockSpeech();P.pendingAutoplay=true;if(location.hash==='#play-'+b.id)route();else location.hash='play-'+b.id;},
  playch(el){unlockSpeech();P.pendingAutoplay=true;P.pendingCh=+el.dataset.ch;const h='play-'+el.dataset.id;if(location.hash==='#'+h)route();else location.hash=h;},
  'cast-continue'(el){const b=Books.get(el.dataset.id);if(b)runCast(b);},
  'cast-ai'(el){const b=Books.get(el.dataset.id);if(!b)return;b.aiFree=false;b.castCursor=0;b.characters=b.characters.filter(c=>c.userEdited);for(const k in b.akind)if(b.akind[k]==='basic'){delete b.akind[k];delete b.analysis[k];}runCast(b);},
  'prepare-all'(el){const b=Books.get(el.dataset.id);if(b)runPrepareAll(b);},
  'stop-job'(el){const j=Jobs.get(el.dataset.id);if(j&&j.ctl)j.ctl.abort();},
  async delete(el){const id=el.dataset.id;if(deleteArm!==id){deleteArm=id;render();return;}
    for(const j of [Jobs.get(id)])if(j&&j.ctl)j.ctl.abort();if(P.book&&P.book.id===id){P.halt();P.book=null;}
    Books.delete(id);Prog.del(id);await Store.del(id);Store.adelBook(id);deleteArm=null;location.hash='library';route();toast('Book removed.');},
  'pl-play'(){unlockSpeech();P.toggle();},
  'pl-back'(){P.skip(-15);},'pl-fwd'(){P.skip(15);},
  'pl-prev'(){if(!P.book)return;if(P.seg>2||P.ch===0)P.jump(P.ch,0);else P.load(P.ch-1,0,P.playing);},
  'pl-next'(){if(P.book&&P.ch+1<P.book.chapters.length)P.load(P.ch+1,0,P.playing);},
  'pl-mark'(){P.addMark();},
  'pl-goto'(el){P.jump(+el.dataset.ch,+el.dataset.seg,true);},
  'pl-delmark'(el){const b=P.book;b.bookmarks=(b.bookmarks||[]).filter(x=>x.id!==el.dataset.id);save(b);renderMarks();},
  'pl-fix'(){P.fix=!P.fix;closeFix();P.renderText();P.ui();},
  'pl-reanalyze'(){const b=P.book;delete b.analysis[P.ch];delete b.akind[P.ch];save(b);P.load(P.ch,P.seg,P.playing);},
  'fix-set'(el){const b=P.book,i=+el.dataset.s;const s=P.segs[i];if(!s)return;s.s=el.dataset.who||null;save(b);closeFix();P.renderText();P.ui();},
  reassign(el){const b=Books.get(el.dataset.id);if(!b)return;b.characters.forEach(c=>c.voiceLocked=false);assignVoices(b,true);save(b);render();toast('Voices reassigned.');},
  'aq-add'(el){const b=Books.get(el.dataset.id);if(b){kkCtx();queuePrepare(b,+el.dataset.ch);}},
  'aq-all'(el){const b=Books.get(el.dataset.id);if(!b)return;b.chapters.forEach((c,i)=>{if(packState(b,i)!=='ready')queuePrepare(b,i);});},
  'aq-stop'(el){const key=el.dataset.id+':'+el.dataset.ch;if(AQ.cur===key)AQ.cancel=key;else AQ.queue=AQ.queue.filter(k=>k!==key);refresh();},
  'aq-wav'(el){const b=Books.get(el.dataset.id);if(b)exportChapterWav(b,+el.dataset.ch);},
  'kk-load'(){kkCtx();if(KK.state==='error'){kkKillWorker();KK.state='off';}kkLoad();},
  'kk-test'(){kkTest();},
  export(el){const b=Books.get(el.dataset.id);if(b)exportBook(b);},
  'preview-narr'(el){const b=Books.get(el.dataset.id);if(engine()==='kokoro'){kkPreview(narrSample(b),b.narrator.kvoice,b);return;}previewSpeak(narrSample(b),b.narrator,b);},
  'preview-char'(el){const b=Books.get(View.id);const c=charById(b,el.dataset.id);if(!c)return;const s=sampleLine(b,c);if(engine()==='kokoro'){kkPreview(s.t,c.kvoice,b,s.e);return;}previewSpeak(s.t,c.voice||b.narrator,b,s.e);},
  'edit-char'(el){Editing.add(el.dataset.id);render();},
  'cancel-char'(el){Editing.delete(el.dataset.id);render();},
  'save-char'(el){const b=Books.get(View.id);const c=charById(b,el.dataset.id);const card=el.closest('[data-char]');if(!c||!card)return;
    const v=n=>card.querySelector(`[name="${n}"]`).value.trim();const g=v('gender');
    c.name=v('name')||c.name;c.aliases=v('aliases').split(',').map(x=>x.trim()).filter(Boolean);c.age=v('age');c.personality=v('personality');c.speakingStyle=v('speakingStyle');c.relationships=v('relationships');c.pron=v('pron');
    if(g!==c.gender){c.gender=g;c.genderEvidence='Set by you';if(!c.voiceLocked){c.voice=null;}}
    c.userEdited=true;assignVoices(b);Editing.delete(c.id);save(b);render();},
  'del-char'(el){const b=Books.get(View.id);const id=el.dataset.id;b.characters=b.characters.filter(c=>c.id!==id);for(const k in b.analysis)for(const s of b.analysis[k])if(s.s===id)s.s=null;Editing.delete(id);save(b);render();},
  'add-char'(el){const b=Books.get(el.dataset.id);const c=newChar(b,'New character');c.userEdited=true;assignVoices(b);Editing.add(c.id);save(b);render();},
  'save-pron'(el){const b=Books.get(el.dataset.id);b.settings.pron=$('#pron').value;save(b);toast('Pronunciations saved.');}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){e.preventDefault();ACT[a.dataset.act]&&ACT[a.dataset.act](a,e);return;}
  const seg=e.target.closest('#pl-text .seg');
  if(seg){if(P.fix){if(seg.classList.contains('d'))openFix(seg);return;}unlockSpeech();P.jump(P.ch,+seg.dataset.s,true);return;}
  if(!e.target.closest('.pop'))closeFix();
  const sk=e.target.closest('#pl-seek');if(sk){const r=sk.getBoundingClientRect();P.seekFrac(clamp((e.clientX-r.left)/r.width,0,1));}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='pl-seek'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();P.skip(e.key==='ArrowLeft'?-15:15);return;}
  if(View.name==='play'&&e.key===' '&&!e.target.closest('input,textarea,select,button')){e.preventDefault();P.toggle();}
});
document.addEventListener('change',e=>{
  const t=e.target;const b=View.id&&Books.get(View.id);
  if(t.matches('[data-upload]')){const f=t.files[0];if(f)handleFile(f);t.value='';return;}
  if(t.matches('[data-sleep]')){P.setSleep(t.value);if(t.value!=='off')toast(t.value==='chapter'?'Playback will pause at the end of this chapter.':`Playback will pause in ${t.value} minutes.`);return;}
  if(t.matches('[data-fixemo]')&&P.segs){const s=P.segs[+t.dataset.fixemo];if(s){s.e=t.value;save(P.book);}return;}
  if(!b)return;
  if(t.matches('[data-kkdev]')){try{localStorage.setItem('sv-kkdevice',t.value);}catch(e){}P.halt();kkKillWorker();KK.tts=null;KK.state='off';KK.cache.clear();KK.lastError='';kkLoad();return;}
  if(t.matches('[data-engine]')){setEngine(t.value);P.halt();KK.cache.clear();render();renderAI();return;}
  if(t.matches('[data-ckvoice]')){const c=charById(b,t.dataset.ckvoice);if(c){c.kvoice=t.value;c.kvoiceLocked=true;save(b);render();}return;}
  if(t.matches('[data-cvoice]')){const c=charById(b,t.dataset.cvoice);if(c){c.voice={name:t.value,pitch:c.voice?.pitch||1};c.voiceLocked=true;save(b);render();}return;}
  if(t.matches('[data-cpitch]')){const c=charById(b,t.dataset.cpitch);if(c){c.voice={name:c.voice?.name||b.narrator.name,pitch:+t.value};c.voiceLocked=true;save(b);render();}return;}
  if(t.matches('[data-set]')){
    const k=t.dataset.set;
    if(k==='speed'){b.settings.speed=+t.value;$$('select[data-set="speed"]').forEach(s=>s.value=t.value);if(P.book===b&&P.playing)P.speak(true);P.ui();}
    else if(k==='intensity')b.settings.intensity=+t.value;
    else if(k==='cast')b.settings.cast=t.value;
    else if(k==='accent'){b.settings.accent=t.value;save(b);render();return;}
    else if(k==='narr-voice')b.narrator={...b.narrator,name:t.value,pitch:b.narrator.pitch||1};
    else if(k==='narr-pitch')b.narrator={...b.narrator,pitch:+t.value};
    else if(k==='narr-kvoice')b.narrator={...b.narrator,kvoice:t.value};
    else if(k==='kaccent'){b.settings.kaccent=t.value;save(b);render();return;}
    save(b);if(View.name==='cast'&&k!=='intensity'&&k!=='narr-pitch')render();
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.type==='range'){const o=t.closest('.field')?.querySelector('output');if(o)o.textContent=t.dataset.set==='intensity'?Math.round(t.value*100)+'%':(+t.value).toFixed(2);}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)handleFile(f);});
['wheel','touchmove'].forEach(ev=>addEventListener(ev,()=>{P.follow=Date.now();},{passive:true}));
addEventListener('hashchange',route);
addEventListener('pagehide',()=>P.save());

/* ---------- Start ---------- */
(async function init(){
  if(canSpeak){loadVoices();speechSynthesis.onvoiceschanged=onVoices;}
  try{if(!IN_CLAUDE&&localStorage.getItem('sv-kk-loading')){localStorage.removeItem('sv-kk-loading');localStorage.setItem('sv-engine','device');setTimeout(()=>toast('Kokoro was too heavy for this device last time, so StoryVoice switched to this device’s voices. You can switch back in the Character studio.'),600);}}catch(e){}
  for(const b of await Store.all()){
    if(b.kind==='pdf'&&!b.flowFixed&&b.chapters&&b.chapters.length){try{if(reflowBook(b))save(b);}catch(e){console.warn(e);}}
    if(b.status==='extracting'){b.status='error';b.statusNote='Processing stopped before the file was fully read. Remove this book and upload it again.';}
    Books.set(b.id,b);
  }
  setupMediaSession();route();
})();
</script>
